[PHP]
; Security hardening
expose_php = Off
allow_url_include = Off
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; disable_functions and open_basedir are set for the FPM pool only
; (configs/php/php-fpm.conf). This file is loaded via php.d for all SAPIs, so
; anything here also hits the CLI: n98-magerun2 db:dump needs passthru, drush
; refuses to run under open_basedir, composer / bin/magento need neither.

; Performance - important for Magento's deep directory tree
realpath_cache_size = 10M
realpath_cache_ttl = 7200
max_input_vars = 75000
