# Local cache Redis on the PHP box (installed from AppStream by
# provision-cp.sh, written to the path the EL9 unit uses:
# /etc/redis/redis.conf, started with --daemonize no --supervised systemd).
# Loopback + unix socket only; the sessions Redis lives in the services env.

bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 511
unixsocket /tmp/redis.sock
unixsocketperm 777
timeout 600
tcp-keepalive 300

daemonize no
supervised systemd
pidfile /run/redis/redis.pid
loglevel notice
logfile /var/log/redis/redis.log
databases 5

# RDB snapshots so the cache survives a restart
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

maxmemory-policy volatile-lru
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

appendonly no
slowlog-log-slower-than 10000
slowlog-max-len 128
