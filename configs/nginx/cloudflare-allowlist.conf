# /etc/nginx/conf.d/cloudflare-allowlist.conf
# Include INSIDE each server{} block that must accept ONLY Cloudflare-proxied traffic.
# Any non-CF client gets 403 immediately, before Magento is touched.
# This closes the origin-bypass vector where scrapers hit the origin IP directly with
# a valid Host: header, walking straight past CF WAF / Bot Fight Mode / rate limits.
#
# Refresh from https://www.cloudflare.com/ips-{v4,v6}
# Automated refresh: /usr/local/bin/refresh-cf-ips.sh (weekly cron).
#
# Introduced 2026-08-29 (ticket #401 origin-bypass lockdown, follow-on to #400).

# Cloudflare edge (v4)
allow 173.245.48.0/20;
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 141.101.64.0/18;
allow 108.162.192.0/18;
allow 190.93.240.0/20;
allow 188.114.96.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;
allow 162.158.0.0/15;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 172.64.0.0/13;
allow 131.0.72.0/22;

# Cloudflare edge (v6)
allow 2400:cb00::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2405:b500::/32;
allow 2405:8100::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;

# Localhost + Cloudlets internal
allow 127.0.0.1;
allow ::1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;

# Office / dev IPs — ADD PER-DEPLOYMENT (below this line, before deny all).
# Example:
#   allow 203.0.113.42;     # Head office static
#   allow 198.51.100.7;     # Home dev
# Bypasses CF for direct-origin admin work / emergency access when CF pauses.

# Everyone else: 403 before Magento is touched
deny all;
