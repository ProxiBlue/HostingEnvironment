worker_processes  auto;
worker_rlimit_nofile 100000;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    server_tokens off;
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main_ext  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          '"$host" sn="$server_name" '
                          'rt=$request_time '
                          'ua="$upstream_addr" us="$upstream_status" '
                          'ut="$upstream_response_time" ul="$upstream_response_length" '
                          'cs=$upstream_cache_status' ;

    access_log  /var/log/nginx/access.log main_ext;

    sendfile        on;
    keepalive_timeout  300;
    send_timeout 300s;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # #400: catalogsearch — tight because filter-param scrapers hammer this path
    limit_req_zone $binary_remote_addr zone=search:10m rate=2r/s;

    # Connection limiting - prevent connection exhaustion
    limit_conn_zone $binary_remote_addr zone=connperip:10m;
    limit_conn connperip 50;

    # #401: origin-lockdown allowlist source-of-truth.
    # Uses $realip_remote_addr (RAW TCP source before real_ip substitution) so
    # CF-proxied requests match on the CF edge IP, not on the real end-user IP.
    # Consumed by conf.d/includes/cloudflare-allowlist.conf which each server{}
    # block includes. Refresh weekly from https://www.cloudflare.com/ips-{v4,v6}
    # via /usr/local/bin/refresh-cf-ips.sh (preserves office/dev entries below).
    geo $realip_remote_addr $cf_allowed {
        default 0;

        # Cloudflare edge v4
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;

        # Cloudflare edge v6
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;

        # Localhost + Cloudlets internal
        127.0.0.1 1;
        ::1 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;

        # Office / dev IPs — ADD PER-DEPLOYMENT below this line.
        # Preserved across refresh-cf-ips.sh regen.
    }

    gzip on;
    gzip_disable "msie6";

    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types
    	text/plain
    	text/css
    	text/js
    	text/xml
   	    text/javascript
    	application/javascript
    	application/x-javascript
    	application/json
    	application/xml
    	application/xml+rss
    	image/svg+xml;
    gzip_vary on;
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*.conf;
    client_max_body_size 100M;
}
