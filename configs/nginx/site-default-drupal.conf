  # Drupal 10/11 vhost body. Included inside the server{} blocks of
  # nossl.conf and ssl.conf. Seeded once by provision-cp.sh into
  # /etc/nginx/conf.d/SITES_ENABLED/site-default.conf (__DOCROOT__ replaced),
  # then owned by the site - edit in place, it survives redeploys.

  index  index.php index.html;
  autoindex off;
  charset UTF-8;

  root __DOCROOT__;

  # Drupal: composer / vendor / config / private files
  location = /favicon.ico { log_not_found off; access_log off; }
  location = /robots.txt  { allow all; log_not_found off; access_log off; }

  location ~* \.(txt|log)$ {
      deny all;
  }
  location ~ \..*/.*\.php$ {
      return 403;
  }
  location ~ ^/sites/.*/private/ {
      return 403;
  }
  location ~ ^/sites/[^/]+/files/.*\.php$ {
      deny all;
  }
  location ~ (^|/)\. {
      return 403;
  }
  location ~ /vendor/.*\.php$ {
      deny all;
      return 404;
  }
  location ~* ^/(composer\.(json|lock)|web\.config|\.editorconfig|\.gitattributes)$ {
      deny all;
  }

  # Rate limit login / password reset (zone "login" from nginx.conf, 2r/s)
  location ~ ^/(user/login|user/password|user/register)$ {
      limit_req zone=login burst=5 nodelay;
      try_files $uri /index.php?$query_string;
  }

  location / {
      try_files $uri /index.php?$query_string;
  }

  location @rewrite {
      rewrite ^ /index.php;
  }

  # Image styles are generated on first request
  location ~ ^/sites/.*/files/styles/ {
      try_files $uri @rewrite;
  }

  # Private files served through Drupal
  location ~ ^(/[a-z\-]+)?/system/files/ {
      try_files $uri /index.php?$query_string;
  }

  # Static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|otf|eot)$ {
      try_files $uri @rewrite;
      expires max;
      add_header Cache-Control "public, max-age=31536000, immutable";
      log_not_found off;
  }

  # Restrict php-fpm status and ping to localhost
  location ~ ^/(status|ping)$ {
      allow 127.0.0.1;
      deny all;
      fastcgi_pass unix:/var/run/php-fpm.socket;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      include fastcgi_params;
  }

  # PHP: index.php, core/*.php (update, install, rebuild), cron
  location ~ '\.php$|^/update.php' {
      fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
      try_files $fastcgi_script_name =404;
      include fastcgi_params;
      fastcgi_param HTTP_PROXY "";
      fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
      fastcgi_param PATH_INFO $fastcgi_path_info;
      fastcgi_param DOCUMENT_ROOT $realpath_root;
      fastcgi_param QUERY_STRING $query_string;
      fastcgi_intercept_errors on;
      fastcgi_buffers 16 16k;
      fastcgi_buffer_size 32k;
      fastcgi_read_timeout 600s;
      fastcgi_connect_timeout 600s;
      fastcgi_send_timeout 600s;
      fastcgi_pass unix:/var/run/php-fpm.socket;
  }

  location /site_report {
      auth_basic           "Administrator's Area";
      auth_basic_user_file /etc/nginx/.htpasswd;
      alias  /var/www/webroot/site_report/;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
  }
