# /etc/nginx/conf.d/includes/cloudflare-allowlist.conf
# CF-only origin lockdown — geo-based (correct).
#
# Deliberately in conf.d/includes/ (subdir) because nginx.conf auto-includes
# /etc/nginx/conf.d/*.conf at http-context and `if` is invalid there.
# Include this file EXPLICITLY inside each server{} block that must accept only
# Cloudflare-proxied traffic.
#
# Depends on: geo $realip_remote_addr $cf_allowed { ... } in nginx.conf http{}.
# We match on $realip_remote_addr (RAW TCP source, before real_ip_header
# substitution) so CF-proxied requests match on the CF edge IP, not on the
# real end-user IP. A naive `allow / deny` on `$remote_addr` breaks under
# real_ip_recursive because $remote_addr gets substituted BEFORE the access
# phase — every legit CF user gets 403. Learned the hard way on LCD 2026-08-29.
#
# Refresh weekly via /usr/local/bin/refresh-cf-ips.sh (regenerates the geo
# block in nginx.conf; preserves office/dev IPs across regen).
#
# Introduced: ticket #401 origin-bypass lockdown.

if ($cf_allowed = 0) {
    return 403;
}
