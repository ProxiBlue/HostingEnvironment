server {

  listen       80;
  listen       [::]:80;
  server_name  localhost;

  # Let's Encrypt HTTP-01 challenge - must respond on the env's primary
  # domain regardless of the per-site vhosts in SITES_ENABLED.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/webroot/ROOT/pub;
    default_type "text/plain";
    try_files $uri =404;
  }

  set $my_http "http";
  set $my_ssl "off";
  set $my_port "80";

  if ($http_x_forwarded_proto = "https") {
    set $my_http "https";
    set $my_ssl "on";
    set $my_port "443";
  }

  include /etc/nginx/conf.d/SITES_ENABLED/*.conf;

}
