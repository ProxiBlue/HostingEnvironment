server {

  listen       80;
  listen       [::]:80;
  server_name  localhost;

  # Let's Encrypt HTTP-01 challenge - must respond on the env's primary
  # domain regardless of the per-site vhosts in SITES_ENABLED.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/webroot/ROOT/pub;
    default_type "text/plain";
    try_files $uri =404;
  }

  set $my_http "http";
  set $my_ssl "off";
  set $my_port "80";

  if ($http_x_forwarded_proto = "https") {
    set $my_http "https";
    set $my_ssl "on";
    set $my_port "443";
  }

  # #401: refuse any non-Cloudflare source at the origin before Magento is touched.
  # ACME challenge above sits BEFORE this include on purpose so certbot can still
  # reach /.well-known/acme-challenge/ from any HTTP-01 validator IP.
  # Placed in conf.d/includes/ (NOT conf.d/) so nginx.conf's http-context glob
  # doesn't try to parse `if` at http level.
  include /etc/nginx/conf.d/includes/cloudflare-allowlist.conf;

  include /etc/nginx/conf.d/SITES_ENABLED/*.conf;

}
