# /etc/nginx/conf.d/cloudflare-geo.conf
# geo block defining $cf_allowed = 1 for any Cloudflare edge / office / dev IP.
# Consumed by conf.d/includes/cloudflare-allowlist.conf which each server{} includes.
#
# Uses $realip_remote_addr (RAW TCP source before real_ip_header substitution) so
# CF-proxied requests match on the CF edge IP, not on the real end-user IP.
# geo is valid in http-context, so this file is safe to sit in conf.d/*.conf glob.
#
# Refresh CF ranges weekly: /usr/local/bin/refresh-cf-ips.sh rewrites this file
# and preserves anything after the "Office / dev IPs" marker.
# Snapshot 2026-08-29 from https://www.cloudflare.com/ips-{v4,v6}
# Introduced: ticket #401 origin-bypass lockdown.

geo $realip_remote_addr $cf_allowed {
    default 0;

    # Cloudflare edge v4
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;

    # Cloudflare edge v6
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;

    # Localhost + Cloudlets internal
    127.0.0.1 1;
    ::1 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;

    # Office / dev IPs — ADD PER-DEPLOYMENT below this line.
    # refresh-cf-ips.sh preserves everything from this marker down to the closing brace.
}
