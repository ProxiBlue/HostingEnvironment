# Detects the #400 catalogsearch filter-param permutation scrape.
# Only 3rd-party scrapers submit these params — human search form doesn't.
# One hit → ban an hour. Paired with nginx `if` block that already returns 301/444.
[Definition]
failregex = ^<HOST> -.*"(GET|POST) /catalogsearch/[^"]*(manufacturer(%%5B|\[)|resolution(%%5B|\[)|pins(%%5B|\[)|screen_brackets|screen_size=)[^"]*HTTP.*
ignoreregex =
