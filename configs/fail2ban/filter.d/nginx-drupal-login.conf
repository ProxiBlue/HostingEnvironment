[Definition]

# Repeated POSTs to Drupal login / password reset / register endpoints.
# Drupal answers a failed login with 200 (form re-rendered) so every POST counts;
# maxretry/findtime in the jail keep normal users clear.
failregex = ^<HOST> -.*"POST /user/login[^"]*HTTP[^"]*" (200|403|429)
            ^<HOST> -.*"POST /user/password[^"]*HTTP[^"]*" (200|403|429)
            ^<HOST> -.*"POST /user/register[^"]*HTTP[^"]*" (200|403|429)
            ^<HOST> -.*"POST /\?q=user/login[^"]*HTTP[^"]*" (200|403|429)

ignoreregex =
